[package]
name = "viberunner"
version = "0.1.0"
description = "Cross-platform runner manager: start/stop your apps with a click"
authors = ["George Paterakis"]
edition = "2021"

[lib]
name = "viberunner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Process & PTY
portable-pty = "0.8"
sysinfo = "0.32"
parking_lot = "0.12"
once_cell = "1"
thiserror = "1"

# Async runtime (re-exported by tauri, declared for direct use)
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util"] }

# File watcher (FSEvents / ReadDirectoryChangesW / inotify)
notify = "6"

# JSONC (JSON with comments) parser for the config file. Lets the user
# add `// comments` and trailing commas when editing by hand.
jsonc-parser = { version = "0.26", default-features = false, features = ["serde"] }

# TOML parser — reads `.codex/environments/environment.toml` from each
# project folder to auto-discover the action buttons (Run / Stop / etc.).
toml = "0.8"

# `.env` loader — reads `<project>/.env` so repos can declare their
# secrets / config next to the code and VibeRunner injects them into
# the spawned PTY.
dotenvy = "0.15"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
